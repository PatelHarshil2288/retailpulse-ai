name: Docker image build

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "requirements.txt"
      - "prepare_deployment.py"
      - "wsgi.py"
      - "src/**"
      - "assets/style.css"
      - ".github/workflows/docker-build.yml"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "requirements.txt"
      - "prepare_deployment.py"
      - "wsgi.py"
      - "src/**"
      - "assets/style.css"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag retailpulse-ai:${{ github.sha }} .
